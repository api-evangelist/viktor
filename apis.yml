aid: viktor
name: Viktor
description: >-
  Viktor is an autonomous AI employee that lives inside Slack and Microsoft
  Teams, connects to 3,200+ business tools, and completes real work rather than
  just answering questions: pulling and reconciling data, generating reports and
  dashboards, running scheduled and proactive automations, writing code and
  managing pull requests, and operating CRM, ads, and analytics workflows.
  Integrations authenticate via managed OAuth (no API keys pasted into chat),
  sensitive actions can require human approval, and the product does not train
  on customer data. Built by Zeta Labs and used by 45,000+ teams, Viktor is
  backed by a $75M Series A led by Accel and holds SOC 2, ISO 27001, GDPR, CCPA,
  and CASA Tier 3 posture. Viktor is a product/company profile in the API
  Evangelist network; it publishes no formal public developer API or OpenAPI
  specification, so this record captures its developer-adjacent surface
  (llms.txt, changelog, security/compliance, domain security).
